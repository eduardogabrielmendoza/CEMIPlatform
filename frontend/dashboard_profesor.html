<body class="dashboard-body profesor">

  <button class="mobile-menu-toggle" id="mobileMenuToggle">

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <main class="dashboard-main">

          <i data-lucide="user"></i>

    <div id="loader" class="loader hidden"></div>

    <section id="mainContent" class="dashboard-content spa-animate active entrance-content"></section>

  <script>
    // Cargar "Mis Cursos" después de que todo esté listo
    window.addEventListener("load", () => {
      const btnCursos = document.getElementById("btnCursos");
      if (btnCursos) {
        btnCursos.classList.add("active");
        sections.btnCursos();
      }
    });

    lucide.createIcons();

  const API_URL = window.API_URL || "http://localhost:3000/api";
  const loader = document.getElementById("loader");
  const mainContent = document.getElementById("mainContent");
  const welcomeMessage = document.getElementById("welcomeMessage");
  const id_profesor = localStorage.getItem("id_profesor");
  
  if (!id_profesor) {
    console.error("No se encontró el ID del profesor");
    window.location.href = "login.html";
  }

  // Cargar Socket.IO primero
  const socketScript = document.createElement('script');
  socketScript.src = 'https://cdn.socket.io/4.7.2/socket.io.min.js';
  socketScript.onload = () => {
    // Luego cargar script del chat y crear instancia
    const chatScript = document.createElement('script');
    chatScript.src = `assets/js/user-chat-manager.js?v=${Date.now()}`; // Cache busting
    chatScript.onload = () => {
      console.log(' user-chat-manager.js cargado correctamente');
      if (typeof UserChatManager !== 'undefined') {
        window.userChatManager = new UserChatManager('profesor');
        // Inicializar Socket.IO inmediatamente para recibir notificaciones
        window.userChatManager.init();
      } else {
        console.error(' UserChatManager no está definido');
      }
    };
    chatScript.onerror = () => {
      console.error(' Error al cargar user-chat-manager.js');
    };
    document.head.appendChild(chatScript);
  };
  document.head.appendChild(socketScript);    // =====================================================
    // Mostrar saludo dinámico con nombre guardado
    const nombreProfesor = localStorage.getItem("nombre") || "Profesor";
    welcomeMessage.textContent = `Bienvenido, ${nombreProfesor} `;

  // Cargar avatar del usuario
  async function cargarAvatarHeader() {
    try {
      console.log(' Iniciando carga de avatar...');
      
      // Detectar tipo de usuario según qué ID existe en localStorage
      let tipoUsuario = 'profesor';
      let idUsuario = localStorage.getItem('id_profesor');
      
      console.log(' id_profesor:', idUsuario);
      
      if (!idUsuario) {
        idUsuario = localStorage.getItem('id_alumno');
        if (idUsuario) {
          tipoUsuario = 'alumno';
        }
      }
      
      if (!idUsuario) {
        console.log(' No se encontró ID de usuario');
        return;
      }
      
      console.log(`Buscando perfil de ${tipoUsuario} con ID: ${idUsuario}`);
      
      const url = `${API_URL}/classroom/perfil/${idUsuario}?tipo=${tipoUsuario}`;
      console.log('URL:', url);
      
      const response = await fetch(url);
      const data = await response.json();
      
      console.log('Respuesta del servidor:', { status: response.status, data });
      
      if (response.ok && data.success && data.perfil) {
        const avatarContainer = document.getElementById('userAvatarHeader');
        console.log('Contenedor encontrado:', !!avatarContainer);
        
        if (avatarContainer && data.perfil.avatar) {
          const BASE_URL = window.BASE_URL || 'http://localhost:3000';
          const avatarUrl = data.perfil.avatar.startsWith('http') 
            ? data.perfil.avatar 
            : `${BASE_URL}${data.perfil.avatar}?t=${Date.now()}`;
          console.log('Cargando avatar:', avatarUrl);
          
          const img = new Image();
          img.onload = function() {
            avatarContainer.innerHTML = `<img src="${avatarUrl}" alt="Avatar" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">`;
          };
          img.onerror = function() {
            console.log('Avatar no disponible, usando icono');
            avatarContainer.innerHTML = '<i data-lucide="user"></i>';
            lucide.createIcons();
          };
          img.src = avatarUrl;
        } else {
          console.log('Sin avatar, usando icono');
          if (avatarContainer) {
            avatarContainer.innerHTML = '<i data-lucide="user"></i>';
            lucide.createIcons();
          }
        }
      } else {
        console.log('Respuesta no valida o usuario no encontrado');
      }
    } catch (error) {
      console.error(' Error al cargar avatar:', error);
    }
  }
  
  cargarAvatarHeader();    // Secciones dinámicas
    const sections = {

    function filterAyudaContent(query) {
      const accordions = document.querySelectorAll('.ayuda-accordion');
      const guiaItems = document.querySelectorAll('.guia-item');
      const noResults = document.getElementById('noResultsMessage');
      const resultsCount = document.getElementById('searchResultsCount');
      let totalVisible = 0;

      if (!query) {
        // Sin búsqueda: mostrar todo normal
        accordions.forEach(acc => {
          acc.classList.remove('hidden', 'open');
        });
        guiaItems.forEach(item => {
          item.classList.remove('hidden', 'highlight');
        });
        noResults.classList.remove('visible');
        resultsCount.classList.remove('visible');
        return;
      }

      // Con búsqueda: filtrar
      accordions.forEach(accordion => {
        const items = accordion.querySelectorAll('.guia-item');
        let hasVisibleItems = false;

        items.forEach(item => {
          const keywords = item.dataset.keywords || '';
          const title = item.querySelector('h4')?.textContent.toLowerCase() || '';
          const desc = item.querySelector('p')?.textContent.toLowerCase() || '';
          const searchText = keywords + ' ' + title + ' ' + desc;

          if (searchText.includes(query)) {
            item.classList.remove('hidden');
            item.classList.add('highlight');
            hasVisibleItems = true;
            totalVisible++;
          } else {
            item.classList.add('hidden');
            item.classList.remove('highlight');
          }
        });

        if (hasVisibleItems) {
          accordion.classList.remove('hidden');
          accordion.classList.add('open');
        } else {
          accordion.classList.add('hidden');
        }
      });

      // Mostrar mensaje si no hay resultados
      if (totalVisible === 0) {
        noResults.classList.add('visible');
        resultsCount.classList.remove('visible');
      } else {
        noResults.classList.remove('visible');
        resultsCount.textContent = `Se encontraron ${totalVisible} resultado${totalVisible !== 1 ? 's' : ''}`;
        resultsCount.classList.add('visible');
      }
    }

    // Función para alternar el modo de edición de calificaciones
    function toggleModoEdicion() {
      try {
        modoEdicion = !modoEdicion;
        const btn = document.getElementById('btnModificarCalificaciones');
        if (!btn) throw new Error('No se encontró el botón de modificar calificaciones');
        
        const btnText = btn.querySelector('span');
        if (!btnText) throw new Error('No se encontró el texto del botón');
        
        btnText.textContent = modoEdicion ? 'Cancelar Edición' : 'Modificar Calificaciones';
        btn.classList.toggle('btn-warning', modoEdicion);

        // Cambiar el estado de las celdas de calificaciones
        const rows = document.querySelectorAll('#calificacionesBody tr');
        rows.forEach(row => {
          const cells = row.querySelectorAll('.calificacion-cell');
          const btnGuardar = row.querySelector('.btn-guardar');
          
          cells.forEach(cell => {
            const valor = cell.textContent;
            if (modoEdicion) {
              cell.innerHTML = `<input type="number" min="0" max="10" step="0.5" value="${valor === '-' ? '' : valor}" class="calificacion-input">`;
            } else {
              const input = cell.querySelector('input');
              cell.textContent = input?.value || '-';
            }
          });
          
          if (btnGuardar) {
            btnGuardar.style.display = modoEdicion ? 'block' : 'none';
          }
        });
      } catch (error) {
        console.error('Error al cambiar modo de edición:', error);
        showNotification(error.message, 'error');
      }
    }

    async function guardarCalificacion(idAlumno, tipo, valor, idCurso) {
      try {
        const response = await fetch(`${API_URL}/calificaciones`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            id_alumno: idAlumno,
            tipo: tipo,
            valor: valor,
            id_curso: idCurso
          })
        });

        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(errorData.message);
        }
        
        showNotification('Calificación guardada exitosamente');
        return true;
      } catch (error) {
        console.error('Error:', error);
        showNotification(error.message, 'error');
        return false;
      }
    }

    // Guardar todas las calificaciones a la vez
    window.guardarTodasCalificaciones = async function(idCurso) {
      try {
        const filas = document.querySelectorAll('#tablaCalificacionesBody tr[data-alumno-id]');
        let guardadas = 0;
        let errores = 0;

        loader.classList.remove('hidden');

        for (const fila of filas) {
          const idAlumno = fila.dataset.alumnoId;
          const inputs = fila.querySelectorAll('.nota-input');
          
          const parcial1 = inputs[0].value ? parseFloat(inputs[0].value) : null;
          const parcial2 = inputs[1].value ? parseFloat(inputs[1].value) : null;
          const final = inputs[2].value ? parseFloat(inputs[2].value) : null;

          try {
            const response = await fetch(`${API_URL}/calificaciones/todas`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                id_alumno: parseInt(idAlumno),
                id_curso: idCurso,
                parcial1,
                parcial2,
                final
              })
            });

            if (response.ok) {
              fila.style.background = '#e8f5e9';
              guardadas++;
            } else {
              errores++;
            }
          } catch (e) {
            errores++;
          }
        }

        loader.classList.add('hidden');

        if (errores === 0) {
          showNotification('Calificaciones guardadas exitosamente', 'success');
        } else {
          showNotification(`Guardadas: ${guardadas}, Errores: ${errores}`, 'warning');
        }

        // Recargar para actualizar estadísticas
        setTimeout(() => {
          const h3El = document.querySelector('#calificacionesContent h3');
          const nombreCurso = h3El ? h3El.textContent.trim() : '';
          cargarCalificacionesCurso(idCurso, nombreCurso);
        }, 1000);

      } catch (error) {
        console.error('Error:', error);
        loader.classList.add('hidden');
        showNotification('Error al guardar las calificaciones', 'error');
      }
    };

    window.cargarAsistenciasPorFecha = async function(idCurso) {
      try {
        const fecha = document.getElementById('fechaAsistencia').value;
        fechaAsistenciaActual = fecha;

        const res = await fetch(`${API_URL}/asistencias/curso/${idCurso}/fecha/${fecha}`);
        const alumnos = await res.json();

        const tbody = document.getElementById('asistenciasTableBody');
        
        if (alumnos.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="3" style="text-align:center; padding: 40px; color: #9ca3af;">
                No hay alumnos inscritos en este curso
              </td>
            </tr>
          `;
          return;
        }

        const filasAsist = alumnos.map(alumno => {
          const estados = ['presente', 'ausente', 'tardanza', 'justificado'];
          const iconos = { presente: 'check', ausente: 'x', tardanza: 'clock', justificado: 'file-text' };
          const colores = { presente: '#22c55e', ausente: '#ef4444', tardanza: '#f59e0b', justificado: '#6b7280' };

          const botonesEstado = estados.map(e => {
            const isActive = alumno.estado === e;
            return '<button class="btn-estado-asistencia ' + e + (isActive ? ' active' : '') + '" onclick="cambiarEstadoAsistencia(' + alumno.id_alumno + ', \'' + e + '\')" title="' + e.charAt(0).toUpperCase() + e.slice(1) + '" style="width: 34px; height: 34px; border-radius: 50%; border: 2px solid ' + (isActive ? colores[e] : '#e5e7eb') + '; background: ' + (isActive ? colores[e] + '15' : 'white') + '; color: ' + (isActive ? colores[e] : '#9ca3af') + '; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; transition: all 0.15s;"><i data-lucide="' + iconos[e] + '" style="width: 14px; height: 14px;"></i></button>';
          }).join('');

          return '<tr data-alumno-id="' + alumno.id_alumno + '">' +
            '<td style="padding: 14px 16px; font-size: 14px; font-weight: 500;">' + alumno.nombre_completo + '</td>' +
            '<td style="padding: 14px 16px; text-align: center;"><div style="display: flex; gap: 6px; justify-content: center;">' + botonesEstado + '</div></td>' +
            '<td style="padding: 14px 16px;"><input type="text" class="observaciones-input" placeholder="Observación..." value="' + (alumno.observaciones || '') + '" data-alumno-id="' + alumno.id_alumno + '" style="width: 100%; padding: 8px 12px; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 13px; font-family: Inter, sans-serif; outline: none;" onfocus="this.style.borderColor=\'#4a5259\'" onblur="this.style.borderColor=\'#e5e7eb\'" /></td>' +
            '</tr>';
        }).join('');

        tbody.innerHTML = filasAsist;
        lucide.createIcons();

      } catch (error) {
        console.error('Error:', error);
        showNotification('Error al cargar asistencias', 'error');
      }
    };

    window.cambiarEstadoAsistencia = function(idAlumno, nuevoEstado) {
      const row = document.querySelector(`tr[data-alumno-id="${idAlumno}"]`);
      const botones = row.querySelectorAll('.btn-estado-asistencia');
      const colores = { presente: '#22c55e', ausente: '#ef4444', tardanza: '#f59e0b', justificado: '#6b7280' };
      
      botones.forEach(btn => {
        btn.classList.remove('active');
        // Reset all to inactive style
        const estados = ['presente', 'ausente', 'tardanza', 'justificado'];
        const estado = estados.find(e => btn.classList.contains(e));
        if (estado) {
          btn.style.borderColor = '#e5e7eb';
          btn.style.background = 'white';
          btn.style.color = '#9ca3af';
        }
      });
      
      const botonSeleccionado = row.querySelector(`.btn-estado-asistencia.${nuevoEstado}`);
      if (botonSeleccionado) {
        botonSeleccionado.classList.add('active');
        botonSeleccionado.style.borderColor = colores[nuevoEstado];
        botonSeleccionado.style.background = colores[nuevoEstado] + '15';
        botonSeleccionado.style.color = colores[nuevoEstado];
      }

      row.style.background = '#fff3e0';
    };

    window.guardarAsistenciasLote = async function(idCurso) {
      try {
        const fecha = fechaAsistenciaActual;
        const filas = document.querySelectorAll('#asistenciasTableBody tr');
        const asistencias = [];

        filas.forEach(fila => {
          const idAlumno = fila.dataset.alumnoId;
          if (!idAlumno) return;

          const botonActivo = fila.querySelector('.btn-estado-asistencia.active');
          const observacionesInput = fila.querySelector('.observaciones-input');
          
          const estado = botonActivo ? botonActivo.classList.contains('presente') ? 'presente' :
                                        botonActivo.classList.contains('ausente') ? 'ausente' :
                                        botonActivo.classList.contains('tardanza') ? 'tardanza' :
                                        'justificado' : 'ausente';

          asistencias.push({
            id_alumno: parseInt(idAlumno),
            estado: estado,
            observaciones: observacionesInput ? observacionesInput.value.trim() : ''
          });
        });

        loader.classList.remove('hidden');

        const response = await fetch(`${API_URL}/asistencias/lote`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            id_curso: idCurso,
            fecha: fecha,
            asistencias: asistencias
          })
        });

        if (!response.ok) throw new Error('Error al guardar');

        loader.classList.add('hidden');
        showNotification('Asistencias guardadas exitosamente', 'success');

        // Recargar para actualizar estadísticas
        setTimeout(() => {
          const h3El = document.querySelector('#asistenciasContent h3');
          const nombreCurso = h3El ? h3El.textContent.trim() : '';
          cargarAsistenciasCurso(idCurso, nombreCurso);
        }, 1000);

      } catch (error) {
        console.error('Error:', error);
        loader.classList.add('hidden');
        showNotification('Error al guardar asistencias', 'error');
      }
    };

      filas.forEach(fila => {
        const idAlumno = parseInt(fila.dataset.alumnoId);
        if (idAlumno) {
          cambiarEstadoAsistencia(idAlumno, estado);
        }
      });

      showNotification(`Todos marcados como: ${estado}`, 'success');
      lucide.createIcons();
    };

    window.verEstadisticasDetalladas = async function(idCurso) {

          modal.id = 'estadisticasModal';
          modal.className = 'estadisticas-modal';
          document.body.appendChild(modal);
        }

        modal.innerHTML = `
          <div class="estadisticas-modal-content">
            <div class="estadisticas-modal-header">
              <h3>Estadísticas Detalladas de Asistencia</h3>
              <button class="close-modal" onclick="cerrarEstadisticasModal()">
                <i data-lucide="x"></i>
              </button>
            </div>
            <div class="estadisticas-modal-body">
              <div class="estadisticas-generales">
                <div class="asist-stat-card info">
                  <h4>${generales.total_clases_dictadas || 0}</h4>
                  <p>Clases Dictadas</p>
                </div>
                <div class="asist-stat-card success">
                  <h4>${generales.porcentaje_asistencia_general || 0}%</h4>
                  <p>Promedio General</p>
                </div>
                <div class="asist-stat-card success">
                  <h4>${generales.total_presentes || 0}</h4>
                  <p>Total Presentes</p>
                </div>
                <div class="asist-stat-card danger">
                  <h4>${generales.total_ausentes || 0}</h4>
                  <p>Total Ausentes</p>
                </div>
              </div>

              <h4 style="margin: 20px 0;">Detalle por Alumno</h4>

              <table class="estadisticas-alumnos-table">
                <thead>
                  <tr>
                    <th>Alumno</th>
                    <th class="center">Total Clases</th>
                    <th class="center">Presentes</th>
                    <th class="center">Ausentes</th>
                    <th class="center">Tardanzas</th>
                    <th class="center">Justificados</th>
                    <th class="center">% Asistencia</th>
                  </tr>
                </thead>
                <tbody>
                  ${por_alumno.map(alumno => {
                    const porcentaje = parseFloat(alumno.porcentaje_asistencia || 0);
                    let badgeClass = '';
                    if (porcentaje >= 80) badgeClass = 'alto';
                    else if (porcentaje >= 60) badgeClass = 'medio';
                    else badgeClass = 'bajo';

                    return `
                      <tr>
                        <td>${alumno.nombre_completo}</td>
                        <td class="center">${alumno.total_clases || 0}</td>
                        <td class="center">${alumno.presentes || 0}</td>
                        <td class="center">${alumno.ausentes || 0}</td>
                        <td class="center">${alumno.tardanzas || 0}</td>
                        <td class="center">${alumno.justificados || 0}</td>
                        <td class="center">
                          <span class="porcentaje-badge ${badgeClass}">
                            ${porcentaje.toFixed(1)}%
                          </span>
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;

        modal.classList.add('active');
        lucide.createIcons();
        loader.classList.add('hidden');

        // Cerrar al hacer clic fuera
        modal.onclick = (e) => {
          if (e.target === modal) cerrarEstadisticasModal();
        };

      } catch (error) {
        console.error('Error:', error);
        loader.classList.add('hidden');
        showNotification('Error al cargar estadísticas', 'error');
      }
    };

    window.cerrarEstadisticasModal = function() {
      const modal = document.getElementById('estadisticasModal');
      if (modal) modal.classList.remove('active');
    };

    window.limpiarAsistenciasCurso = async function(idCurso, nombreCurso) {
      // Mostrar confirmación
      const confirmacion = confirm(
        `️ ATENCIÓN\n\n` +
        `Estás a punto de ELIMINAR TODAS las asistencias registradas del curso:\n` +
        `"${nombreCurso}"\n\n` +
        `Esta acción NO se puede deshacer.\n\n` +
        `¿Estás seguro de continuar?`
      );

      if (!confirmacion) return;

      // Segunda confirmación
      const segundaConfirmacion = confirm(
        `️ ÚLTIMA CONFIRMACIÓN\n\n` +
        `Se eliminarán PERMANENTEMENTE todos los registros de asistencia.\n\n` +
        `¿Confirmas la eliminación?`
      );

      if (!segundaConfirmacion) return;

      try {
        loader.classList.remove('hidden');

        const response = await fetch(`${API_URL}/asistencias/curso/${idCurso}`, {
          method: 'DELETE'
        });

        if (!response.ok) throw new Error('Error al eliminar');

        const data = await response.json();

        loader.classList.add('hidden');
        showNotification(
          ` Eliminados ${data.registros_eliminados} registros de asistencia`,
          'success'
        );

        // Recargar la vista
        setTimeout(() => {
          cargarAsistenciasCurso(idCurso, nombreCurso);
        }, 1500);

      } catch (error) {
        console.error('Error:', error);
        loader.classList.add('hidden');
        showNotification('Error al eliminar asistencias', 'error');
      }
    };

    window.volverACursosAsistencias = function() {
      const asistenciasContent = document.getElementById('asistenciasContent');
      asistenciasContent.style.display = 'none';
      cursoAsistenciaActual = null;
      fechaAsistenciaActual = null;
    };

    document.addEventListener("DOMContentLoaded", () => {
      const btnCursos = document.getElementById("btnCursos");
      if (btnCursos) {
        btnCursos.classList.add("active");
        btnCursos.click();
      }
    });

    // =============================================
    // Notificaciones del Sistema
    // =============================================
    async function cargarNotificacionesSistema() {
      try {
        const idUsuario = localStorage.getItem('id_usuario');
        if (!idUsuario) return;
        const res = await fetch(`${API_URL}/recuperacion/notificaciones/${idUsuario}`);
        if (!res.ok) return;
        const notifs = await res.json();
        const noLeidas = Array.isArray(notifs) ? notifs.filter(n => !n.leida).length : 0;
        const badge = document.getElementById('notifBellBadge');
        if (badge) {
          if (noLeidas > 0) {
            badge.textContent = noLeidas;
            badge.style.display = 'inline-block';
          } else {
            badge.style.display = 'none';
          }
        }
      } catch (error) { /* silent */ }
    }

    async function mostrarNotificacionesSistema() {
      try {
        const idUsuario = localStorage.getItem('id_usuario');
        if (!idUsuario) return;
        const res = await fetch(`${API_URL}/recuperacion/notificaciones/${idUsuario}`);
        const notifs = await res.json();
        if (!Array.isArray(notifs) || notifs.length === 0) {
          Swal.fire({ title: 'Notificaciones', html: '<p style="color: #888; text-align: center; padding: 20px;">No tenés notificaciones.</p>', confirmButtonColor: '#0A2540' });
          return;
        }
        const html = notifs.map(n => `
          <div style="padding: 12px; border-bottom: 1px solid #eee; text-align: left; ${!n.leida ? 'background: #f0f7ff;' : ''}">
            <p style="font-weight: 600; font-size: 14px; color: #0A2540; margin: 0 0 4px 0;">${n.titulo || 'Notificación'}</p>
            <p style="font-size: 13px; color: #333; margin: 0 0 4px 0;">${n.mensaje || ''}</p>
            <p style="font-size: 11px; color: #999; margin: 0;">${n.fecha_creacion ? new Date(n.fecha_creacion).toLocaleString('es-AR') : ''}</p>
          </div>
        `).join('');
        Swal.fire({ title: 'Notificaciones', html: `<div style="max-height: 400px; overflow-y: auto;">${html}</div>`, confirmButtonColor: '#0A2540', confirmButtonText: 'Cerrar', width: '450px' });
        for (const n of notifs.filter(x => !x.leida)) {
          try { await fetch(`${API_URL}/recuperacion/notificaciones/${n.id_notificacion}/leer`, { method: 'PUT' }); } catch(e) {}
        }
        const badge = document.getElementById('notifBellBadge');
        if (badge) badge.style.display = 'none';
      } catch (error) { console.error('Error cargando notificaciones:', error); }
    }

    // Inicializar notificaciones
    cargarNotificacionesSistema();
    setInterval(cargarNotificacionesSistema, 60000);
  </script>

  <script>
    // Funcionalidad del menú mobile
    document.addEventListener('DOMContentLoaded', function() {
      const mobileMenuToggle = document.getElementById('mobileMenuToggle');
      const sidebar = document.getElementById('sidebar');
      const sidebarOverlay = document.getElementById('sidebarOverlay');
      const dashboardMain = document.querySelector('.dashboard-main');
      
      if (mobileMenuToggle && sidebar && sidebarOverlay) {
        // Abrir/cerrar sidebar
        mobileMenuToggle.addEventListener('click', function() {
          sidebar.classList.toggle('open');
          sidebarOverlay.classList.toggle('active');
          if (dashboardMain) {
            dashboardMain.classList.toggle('sidebar-open');
          }
          
          // Cambiar icono
          const icon = this.querySelector('i');
          if (icon) {
            if (sidebar.classList.contains('open')) {
              icon.setAttribute('data-lucide', 'x');
            } else {
              icon.setAttribute('data-lucide', 'menu');
            }
            lucide.createIcons();
          }
        });
        
        // Cerrar sidebar al hacer clic en overlay
        sidebarOverlay.addEventListener('click', function() {
          sidebar.classList.remove('open');
          sidebarOverlay.classList.remove('active');
          if (dashboardMain) {
            dashboardMain.classList.remove('sidebar-open');
          }
          
          const icon = mobileMenuToggle.querySelector('i');
          if (icon) {
            icon.setAttribute('data-lucide', 'menu');
            lucide.createIcons();
          }
        });
      }
    });
  </script>

  <link rel="stylesheet" href="assets/css/user-chat-manager.css">
</body>
